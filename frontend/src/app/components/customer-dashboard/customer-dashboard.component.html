<!-- components/customer-dashboard/customer-dashboard.component.html -->
<nav class="customer-navbar">
  <div class="navbar-brand">
    <i class="bi bi-truck"></i>
    <span>Delivery System</span>
  </div>
  <div class="navbar-menu">
    <a routerLink="/customer/orders" routerLinkActive="active" class="nav-link">
      <i class="bi bi-box-seam"></i> My Orders
    </a>
    <a
      routerLink="/customer/orders/new"
      routerLinkActive="active"
      class="nav-link"
    >
      <i class="bi bi-plus-circle"></i> New Order
    </a>
  </div>
  <div class="navbar-end">
    <button class="btn-logout" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i> Logout
    </button>
  </div>
</nav>

<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Welcome to Your Delivery Dashboard</h1>
    <p>Manage your orders and deliveries in one place</p>
  </div>

  <div class="main-content">
    <div class="sidebar">
      <div class="nav-menu">
        <a
          routerLink="/customer/orders"
          routerLinkActive="active"
          class="nav-item"
        >
          <i class="bi bi-box-seam"></i>
          <span>My Orders</span>
        </a>
        <a
          routerLink="/customer/orders/new"
          routerLinkActive="active"
          class="nav-item"
        >
          <i class="bi bi-plus-circle"></i>
          <span>Place New Order</span>
        </a>
      </div>
    </div>
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
